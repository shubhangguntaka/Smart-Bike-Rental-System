# ==========================
# Server Configuration
# ==========================
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8888}

# ==========================
# Database Configuration
# ==========================
spring.datasource.url=${DB_URL:jdbc:mysql://mysql.railway.internal:3306/bike_rental}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tiger}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

# ==========================
# File Upload Configuration
# ==========================
spring.servlet.multipart.enabled=${MULTIPART_ENABLED:true}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:20MB}

# ==========================
# Swagger / OpenAPI
# ==========================
springdoc.api-docs.enabled=${SWAGGER_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}

# ==========================
# Logging
# ==========================
logging.level.org.springframework=${LOGGING_LEVEL_SPRING:INFO}
logging.level.com.sssit.bikerental=${LOGGING_LEVEL_APP:DEBUG}

