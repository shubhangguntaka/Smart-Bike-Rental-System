# ==========================
# Server Configuration
# ==========================
server.address=${SERVER_ADDRESS}
server.port=${PORT}

# ==========================
# Database Configuration
# ==========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}

# ==========================
# File Upload Configuration
# ==========================
spring.servlet.multipart.enabled=${MULTIPART_ENABLED}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

# ==========================
# Swagger / OpenAPI
# ==========================
springdoc.api-docs.enabled=${SWAGGER_DOCS_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED}

# ==========================
# Logging
# ==========================
logging.level.org.springframework=${LOGGING_LEVEL_SPRING}
logging.level.com.sssit.bikerental=${LOGGING_LEVEL_APP}

# ==========================
# Mail Configuration
# ==========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================
# JWT
# ==========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ==========================
# Razorpay
# ==========================
RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}

# ==========================
# Payment & Billing
# ==========================
payment.platform-fee-threshold=${PAYMENT_PLATFORM_FEE_THRESHOLD}
payment.lower-platform-fee-percent=${PAYMENT_LOWER_PLATFORM_FEE_PERCENT}
payment.upper-platform-fee-percent=${PAYMENT_UPPER_PLATFORM_FEE_PERCENT}
payment.late-charge-rate=${PAYMENT_LATE_CHARGE_RATE}
payment.late-grace-minutes=${PAYMENT_LATE_GRACE_MINUTES}
